<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share Mode — URL-to-Infographic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .share-screen { min-height: 100vh; display: flex; flex-direction: column; background: #0f172a; }

    /* Minimal top bar */
    .share-topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--space-3) var(--space-6);
      background: rgba(15,23,42,0.95); backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .share-topbar-left { display: flex; align-items: center; gap: var(--space-3); }
    .share-logo {
      display: flex; align-items: center; gap: var(--space-2);
      font-weight: 700; font-size: var(--font-size-sm); color: rgba(255,255,255,0.5);
    }
    .share-logo .logo-dot { width: 20px; height: 20px; background: var(--color-primary); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; }
    .share-title { font-weight: 600; font-size: var(--font-size-sm); color: rgba(255,255,255,0.8); }
    .share-topbar-right { display: flex; align-items: center; gap: var(--space-3); }
    .share-btn-icon {
      width: 36px; height: 36px; border-radius: var(--radius-md);
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all var(--transition-fast);
    }
    .share-btn-icon:hover { background: rgba(255,255,255,0.15); color: #fff; }

    /* Main */
    .share-main {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: var(--space-6) var(--space-16); position: relative;
    }

    /* Infographic container */
    .share-infographic-container {
      max-width: 840px; width: 100%; position: relative;
    }
    .share-infographic {
      width: 100%; aspect-ratio: 3 / 2;
      border-radius: var(--radius-xl); overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
      background: #fff;
      transition: opacity 0.25s ease;
    }

    /* Insight title below image */
    .share-insight-title {
      text-align: center; margin-top: var(--space-4);
      font-size: var(--font-size-lg); font-weight: 700;
      color: rgba(255,255,255,0.7);
    }

    /* Nav arrows dark */
    .nav-arrow-dark {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.6); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all var(--transition-fast); z-index: 5;
    }
    .nav-arrow-dark:hover { background: rgba(255,255,255,0.15); color: #fff; }
    .nav-prev-dark { left: -22px; }
    .nav-next-dark { right: -22px; }

    /* Bottom */
    .share-bottom {
      padding: var(--space-4) var(--space-6);
      display: flex; align-items: center; justify-content: space-between;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .share-bottom-center {
      display: flex; align-items: center; gap: var(--space-4);
      position: absolute; left: 50%; transform: translateX(-50%);
    }
    .share-counter { font-size: var(--font-size-sm); font-weight: 600; color: rgba(255,255,255,0.5); }
    .share-dots { display: flex; gap: 6px; }
    .share-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: rgba(255,255,255,0.2); transition: all var(--transition-fast);
      cursor: pointer;
    }
    .share-dot.active { background: var(--color-primary); width: 20px; border-radius: 3px; }
    .share-cta {
      display: inline-flex; align-items: center; gap: var(--space-2);
      padding: var(--space-2) var(--space-4);
      border: 1px solid rgba(255,255,255,0.15); border-radius: var(--radius-full);
      font-size: var(--font-size-sm); color: rgba(255,255,255,0.5);
      cursor: pointer; transition: all var(--transition-fast); background: transparent;
      font-family: var(--font-family);
    }
    .share-cta:hover { border-color: var(--color-primary); color: var(--color-primary); }

    /* Share progress */
    .share-progress { position: fixed; bottom: 0; left: 0; right: 0; height: 2px; background: rgba(255,255,255,0.05); z-index: 20; }
    .share-progress-fill { height: 100%; background: var(--color-primary); transition: width 0.3s ease; }

    /* ===== SHARE MODAL ===== */
    .share-modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center; z-index: 100;
    }
    .share-modal {
      background: var(--color-surface); border-radius: var(--radius-xl);
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.4);
      padding: var(--space-8); max-width: 420px; width: 90%;
    }
    .share-modal h3 {
      font-size: var(--font-size-xl); font-weight: 800; margin-bottom: var(--space-2);
    }
    .share-modal .modal-subtitle {
      font-size: var(--font-size-sm); color: var(--color-text-secondary); margin-bottom: var(--space-6);
    }

    /* Copy link */
    .copy-link-group { display: flex; gap: var(--space-2); margin-bottom: var(--space-6); }
    .copy-link-input {
      flex: 1; padding: var(--space-3) var(--space-4);
      background: var(--color-background); border: 1px solid var(--color-border);
      border-radius: var(--radius-md); font-family: var(--font-family);
      font-size: var(--font-size-sm); color: var(--color-text-secondary);
    }
    .copy-link-btn {
      padding: var(--space-3) var(--space-5);
      background: var(--color-primary); color: #fff;
      border: none; border-radius: var(--radius-md);
      font-family: var(--font-family); font-size: var(--font-size-sm); font-weight: 600;
      cursor: pointer; display: flex; align-items: center; gap: var(--space-2);
      transition: all var(--transition-fast); white-space: nowrap;
    }
    .copy-link-btn:hover { background: var(--color-primary-hover); }

    /* Social buttons */
    .social-share { display: flex; gap: var(--space-3); margin-bottom: var(--space-6); }
    .social-btn {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: var(--space-2);
      padding: var(--space-3); border-radius: var(--radius-md);
      border: 1px solid var(--color-border); background: var(--color-surface);
      cursor: pointer; font-family: var(--font-family); font-size: var(--font-size-sm);
      font-weight: 500; color: var(--color-text); transition: all var(--transition-fast);
    }
    .social-btn:hover { background: var(--color-background); border-color: var(--color-text-muted); }
    .social-btn svg { width: 18px; height: 18px; }

    /* QR Code */
    .qr-section {
      text-align: center; padding: var(--space-5);
      background: var(--color-background); border-radius: var(--radius-lg);
    }
    .qr-placeholder {
      width: 120px; height: 120px; margin: 0 auto var(--space-3);
      background: var(--color-surface); border: 2px dashed var(--color-border);
      border-radius: var(--radius-md); display: flex; align-items: center;
      justify-content: center; color: var(--color-text-muted);
    }
    .qr-label { font-size: var(--font-size-xs); color: var(--color-text-muted); }

    @media (max-width: 768px) {
      .share-main { padding: var(--space-4); }
      .nav-arrow-dark { width: 36px; height: 36px; }
    }
  </style>
</head>
<body>
  <div class="share-screen">
    <!-- Top bar -->
    <div class="share-topbar">
      <div class="share-topbar-left">
        <div class="share-logo">
          <div class="logo-dot">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="m8 21 4-4 4 4"/></svg>
          </div>
          Glyph
        </div>
        <span class="share-title">How AI Is Changing Design in 2025</span>
      </div>
      <div class="share-topbar-right">
        <button class="share-btn-icon" aria-label="Share" title="Share" id="shareOpenBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        </button>
      </div>
    </div>

    <!-- Main -->
    <div class="share-main">
      <div class="share-infographic-container">
        <button class="nav-arrow-dark nav-prev-dark" aria-label="Previous">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="nav-arrow-dark nav-next-dark" aria-label="Next">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>

        <div class="share-infographic animate-fade-in" id="shareInfographic"></div>
        <div class="share-insight-title" id="shareInsightTitle"></div>
      </div>
    </div>

    <!-- Bottom -->
    <div class="share-bottom" style="position: relative;">
      <div></div>
      <div class="share-bottom-center">
        <div class="share-dots" id="shareDots"></div>
        <span class="share-counter" id="shareCounter">1 / 12</span>
      </div>
      <button class="share-cta" id="shareCta">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        Create your own slides
      </button>
    </div>
    <div class="share-progress"><div class="share-progress-fill" id="shareProgressFill"></div></div>

    <!-- Share Modal -->
    <div class="share-modal-overlay" id="shareOverlay">
      <div class="share-modal animate-fade-in" style="position: relative;">
        <h3>Share this deck</h3>
        <p class="modal-subtitle">Anyone with the link can view these slides</p>

        <div class="copy-link-group">
          <input class="copy-link-input" value="glyph.co/d/ai-design-2025" readonly>
          <button class="copy-link-btn" id="copyLinkBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copy
          </button>
        </div>

        <div class="social-share">
          <button class="social-btn">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
            Twitter
          </button>
          <button class="social-btn">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
            LinkedIn
          </button>
          <button class="social-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            Email
          </button>
        </div>

        <div class="qr-section">
          <div class="qr-placeholder">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          </div>
          <div class="qr-label">Scan to view on mobile</div>
        </div>
      </div>
    </div>
  </div>
<script>
  // SVG infographic generator
  function generateInfographicSVG(insight, index) {
    const accent = insight.colors.accent;
    const ideas = insight.supportingIdeas;
    return `<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block;">
      <rect width="900" height="600" fill="#fff"/>
      <rect x="20" y="20" width="860" height="560" rx="12" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="8 4"/>
      <text x="60" y="75" font-family="Inter,system-ui,sans-serif" font-size="28" font-weight="800" fill="${accent}">${escapeXml(insight.mainIdea)}</text>
      <line x1="60" y1="95" x2="400" y2="95" stroke="${accent}" stroke-width="3" stroke-linecap="round"/>
      <circle cx="840" cy="55" r="22" fill="${accent}" opacity="0.1"/>
      <text x="840" y="62" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="700" fill="${accent}" text-anchor="middle">${index + 1}</text>
      <rect x="60" y="115" width="500" height="120" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <text x="80" y="145" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#475569">
        ${wrapText(insight.summary, 70).map((line, i) => `<tspan x="80" dy="${i === 0 ? 0 : 18}">${escapeXml(line)}</tspan>`).join('')}
      </text>
      ${ideas.map((idea, i) => {
        const y = 260 + i * 105;
        const colors = ['#ef4444', '#22c55e', '#3b82f6', '#a855f7', '#f59e0b'];
        const dotColor = colors[i % colors.length];
        return `
        <circle cx="80" cy="${y + 18}" r="8" fill="${dotColor}" opacity="0.2"/>
        <circle cx="80" cy="${y + 18}" r="4" fill="${dotColor}"/>
        <text x="100" y="${y + 24}" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="700" fill="#1e293b">${escapeXml(idea.idea)}</text>
        <text x="100" y="${y + 46}" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#64748b">
          ${wrapText(idea.detail, 85).slice(0, 3).map((line, j) => `<tspan x="100" dy="${j === 0 ? 0 : 14}">${escapeXml(line)}</tspan>`).join('')}
        </text>`;
      }).join('')}
      <rect x="600" y="115" width="240" height="460" rx="8" fill="${accent}" opacity="0.04"/>
      <text x="620" y="150" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="700" fill="${accent}" letter-spacing="1">KEY INSIGHT</text>
      <line x1="620" y1="160" x2="820" y2="160" stroke="${accent}" stroke-width="1" opacity="0.3"/>
      <text x="620" y="185" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#475569" font-weight="600">
        ${wrapText(insight.summary.split('.')[0] + '.', 30).map((line, i) => `<tspan x="620" dy="${i === 0 ? 0 : 18}">${escapeXml(line)}</tspan>`).join('')}
      </text>
      <path d="M620 280 C650 260 700 260 720 290" fill="none" stroke="${accent}" stroke-width="2" stroke-dasharray="4 3"/>
      <polygon points="718,285 725,295 715,293" fill="${accent}"/>
      <text x="620" y="540" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#94a3b8">Generated by Glyph • gpt-image-2</text>
    </svg>`;
  }

  function escapeXml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function wrapText(text, maxChars) {
    const words = text.split(' ');
    const lines = [];
    let current = '';
    for (const word of words) {
      if ((current + ' ' + word).trim().length > maxChars) {
        lines.push(current.trim());
        current = word;
      } else {
        current += ' ' + word;
      }
    }
    if (current.trim()) lines.push(current.trim());
    return lines;
  }

  // Insight data
  const insights = [
    { mainIdea: "Avoid Made-Up Startup Ideas", summary: "The most common mistake founders make is trying to think up startup ideas rather than noticing problems they personally experience. Manufactured ideas feel plausible but lack the organic urgency that drives great companies.", supportingIdeas: [{idea:"Organic vs. Manufactured Ideas",detail:"Ideas from personal frustration carry built-in conviction."},{idea:"The Schlep Blindness Problem",detail:"Many valuable problems go unsolved because founders avoid tedious work."},{idea:"Living in the Future",detail:"The best founders operate at the frontier of their field."}], colors:{bg:'#fff',accent:'#6366f1',title:'#1e293b'} },
    { mainIdea: "Build a Deep Well, Not a Shallow Pool", summary: "Startups succeed by going extraordinarily deep on a narrow problem rather than spreading thin across many.", supportingIdeas: [{idea:"The Power of Narrow Focus",detail:"Every iconic startup started with a single use case executed at an elite level."},{idea:"Depth Creates Switching Costs",detail:"Deep domain understanding makes your product nearly impossible to displace."},{idea:"Expert Networks Form Around Depth",detail:"Deep expertise attracts the best talent and advisors."}], colors:{bg:'#fff',accent:'#14b8a6',title:'#1e293b'} },
    { mainIdea: "AI Won't Replace Designers — It Will Amplify Them", summary: "The 2025 design landscape reveals that AI tools are augmenting human creativity rather than substituting it.", supportingIdeas: [{idea:"The 80/20 Split Is Real",detail:"AI handles 80% of production tasks freeing designers for the 20% that matters."},{idea:"New Design Roles Are Emerging",detail:"Roles like AI Design Director reflect a shift to creative orchestration."},{idea:"Quality Ceilings Still Need Humans",detail:"The leap from good to great still requires human taste."}], colors:{bg:'#fff',accent:'#f43f5e',title:'#1e293b'} },
    { mainIdea: "Design Systems Are Becoming Living Organisms", summary: "Modern design systems have evolved beyond static component libraries into dynamic, self-updating ecosystems.", supportingIdeas: [{idea:"Auto-Generated Components",detail:"AI analyzes recurring UI patterns and proposes new reusable components."},{idea:"Usage Analytics Drive Evolution",detail:"Real-time tracking provides data-driven guidance for design system roadmaps."},{idea:"Cross-Platform Consistency",detail:"AI ensures design tokens remain consistent across web, mobile, and emerging platforms."}], colors:{bg:'#fff',accent:'#8b5cf6',title:'#1e293b'} },
    { mainIdea: "The Prototype Is the Product", summary: "The boundary between prototyping and production has dissolved.", supportingIdeas: [{idea:"Zero-Handoff Workflows",detail:"Design-to-code tools produce output that passes engineering code review."},{idea:"Real Data in Prototypes",detail:"Modern prototypes connect to live APIs making user testing more realistic."},{idea:"Iteration Speed as Moat",detail:"Going from idea to production in hours is a fundamental competitive advantage."}], colors:{bg:'#fff',accent:'#f59e0b',title:'#1e293b'} },
    { mainIdea: "Personalization at Scale Changes Everything", summary: "AI enables interfaces that adapt to individual users in real-time.", supportingIdeas: [{idea:"Behavioral Adaptation",detail:"Interfaces learn from individual interaction patterns."},{idea:"Context-Aware Layouts",detail:"The same app can present differently based on context."},{idea:"Ethical Boundaries",detail:"Personalization requires careful guardrails to prevent dark patterns."}], colors:{bg:'#fff',accent:'#14b8a6',title:'#1e293b'} },
    { mainIdea: "Voice and Gesture Are the Next Interface Frontier", summary: "As spatial computing matures, designers must think beyond screen-based interaction.", supportingIdeas: [{idea:"Spatial UI Patterns",detail:"Designing for 3D space requires new conventions for depth and proximity."},{idea:"Multimodal Input",detail:"The most effective interfaces combine voice, gesture, gaze, and touch."},{idea:"Accessibility-First Spatial Design",detail:"Spatial interfaces risk excluding users unless accessibility is built in."}], colors:{bg:'#fff',accent:'#6366f1',title:'#1e293b'} },
    { mainIdea: "Data Visualization Is Becoming Conversational", summary: "Static charts are being replaced by interactive, AI-powered data conversations.", supportingIdeas: [{idea:"Natural Language to Charts",detail:"Users describe what they want to see and AI generates the optimal visualization."},{idea:"Narrative Data Storytelling",detail:"AI identifies patterns and constructs visual narratives."},{idea:"Real-Time Collaborative Analysis",detail:"Multiple stakeholders interact with the same visualization."}], colors:{bg:'#fff',accent:'#f43f5e',title:'#1e293b'} },
    { mainIdea: "Adoption by the Numbers", summary: "The quantitative evidence for AI design adoption is overwhelming. Tool adoption has grown 340% year-over-year.", supportingIdeas: [{idea:"340% Tool Adoption Growth",detail:"From niche experimentation to mainstream adoption."},{idea:"67% Daily Usage Rate",detail:"The majority of design teams have integrated AI tools into daily workflows."},{idea:"4.2x Iteration Speed",detail:"Generate, test, and refine variations in minutes rather than days."}], colors:{bg:'#fff',accent:'#8b5cf6',title:'#1e293b'} },
    { mainIdea: "The Ethics of AI-Generated Design", summary: "As AI generates more of what users see, questions of originality, attribution, and bias become critical.", supportingIdeas: [{idea:"Training Data Provenance",detail:"Designers demand transparency about training datasets."},{idea:"Bias in Generated Outputs",detail:"AI tools can perpetuate and amplify existing biases."},{idea:"New IP Frameworks",detail:"Legal frameworks for AI-generated work are still being defined."}], colors:{bg:'#fff',accent:'#f59e0b',title:'#1e293b'} },
    { mainIdea: "Collaborative AI Is the Future of Design Teams", summary: "The most productive design teams in 2025 treat AI as a team member rather than a tool.", supportingIdeas: [{idea:"AI as Design Critic",detail:"AI reviews designs against accessibility and brand standards."},{idea:"Brainstorm Amplification",detail:"AI generates conceptual variations during ideation sessions."},{idea:"Autonomous Routine Decisions",detail:"Spacing, alignment, and contrast are increasingly handled by AI."}], colors:{bg:'#fff',accent:'#14b8a6',title:'#1e293b'} },
    { mainIdea: "The Future Belongs to Design-Literate Engineers", summary: "The convergence of design and engineering means professionals who understand both have an outsized advantage.", supportingIdeas: [{idea:"Blurred Role Boundaries",detail:"Tools enable both roles to work in the same medium."},{idea:"Full-Stack Product Thinking",detail:"The most effective builders understand psychology, design, architecture, and business."},{idea:"New Educational Models",detail:"Schools offer hybrid programs combining design with engineering."}], colors:{bg:'#fff',accent:'#6366f1',title:'#1e293b'} }
  ];

  let current = 0;
  const infographicEl = document.getElementById('shareInfographic');
  const titleEl = document.getElementById('shareInsightTitle');
  const dotsEl = document.getElementById('shareDots');
  const counterEl = document.getElementById('shareCounter');
  const progressFill = document.getElementById('shareProgressFill');

  function renderShareSlide() {
    const insight = insights[current];
    infographicEl.style.opacity = 0;
    setTimeout(() => {
      infographicEl.innerHTML = generateInfographicSVG(insight, current);
      infographicEl.style.opacity = 1;
    }, 150);
    titleEl.textContent = insight.mainIdea;
    counterEl.textContent = `${current + 1} / ${insights.length}`;
    progressFill.style.width = `${((current + 1) / insights.length) * 100}%`;

    dotsEl.innerHTML = insights.map((_, i) =>
      `<div class="share-dot${i === current ? ' active' : ''}" data-i="${i}"></div>`
    ).join('');
    dotsEl.querySelectorAll('.share-dot').forEach(d => {
      d.addEventListener('click', () => { current = parseInt(d.dataset.i); renderShareSlide(); });
    });
  }

  // Nav
  document.querySelector('.nav-prev-dark').addEventListener('click', () => {
    current = (current - 1 + insights.length) % insights.length;
    renderShareSlide();
  });
  document.querySelector('.nav-next-dark').addEventListener('click', () => {
    current = (current + 1) % insights.length;
    renderShareSlide();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') { current = (current - 1 + insights.length) % insights.length; renderShareSlide(); }
    if (e.key === 'ArrowRight') { current = (current + 1) % insights.length; renderShareSlide(); }
    if (e.key === 'Escape') document.getElementById('shareOverlay').style.display = 'none';
  });

  // Modal
  const overlay = document.getElementById('shareOverlay');
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) overlay.style.display = 'none';
  });
  document.getElementById('shareOpenBtn').addEventListener('click', () => {
    overlay.style.display = 'flex';
  });

  // Copy link
  document.getElementById('copyLinkBtn').addEventListener('click', function() {
    this.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Copied!';
    setTimeout(() => {
      this.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy';
    }, 2000);
  });

  // CTA → Landing
  document.getElementById('shareCta').addEventListener('click', () => { window.location.href = 'screen1-landing.html'; });

  renderShareSlide();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slide Viewer — URL-to-Infographic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .viewer { min-height: 100vh; display: flex; flex-direction: column; background: var(--color-background); }

    /* Top bar */
    .viewer-topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--space-3) var(--space-6);
      background: var(--color-surface); border-bottom: 1px solid var(--color-border);
    }
    .viewer-topbar-left { display: flex; align-items: center; gap: var(--space-4); }
    .viewer-back {
      display: flex; align-items: center; gap: var(--space-2);
      background: none; border: none; cursor: pointer; color: var(--color-text-secondary);
      font-family: var(--font-family); font-size: var(--font-size-sm); font-weight: 500;
      padding: var(--space-2) var(--space-3); border-radius: var(--radius-md);
      transition: all var(--transition-fast);
    }
    .viewer-back:hover { background: var(--color-background); color: var(--color-text); }
    .viewer-title {
      font-weight: 700; font-size: var(--font-size-base);
      max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .viewer-topbar-right { display: flex; align-items: center; gap: var(--space-3); }

    /* Main area */
    .viewer-main {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      padding: var(--space-6) var(--space-16); position: relative; overflow-y: auto;
    }

    /* Infographic image container */
    .infographic-container {
      max-width: 840px; width: 100%; position: relative;
    }
    .infographic-img {
      width: 100%; aspect-ratio: 3 / 2; object-fit: cover;
      border-radius: var(--radius-xl); box-shadow: var(--shadow-xl);
      background: #fff; display: block;
      transition: opacity 0.25s ease;
    }

    /* Placeholder infographic (SVG-based whiteboard style) */
    .infographic-placeholder {
      width: 100%; aspect-ratio: 3 / 2;
      border-radius: var(--radius-xl); box-shadow: var(--shadow-xl);
      background: #fff; overflow: hidden;
      transition: opacity 0.25s ease;
    }

    /* Navigation arrows */
    .nav-arrow {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 48px; height: 48px; border-radius: 50%;
      background: rgba(255,255,255,0.9); border: 1px solid var(--color-border);
      box-shadow: var(--shadow-md); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--color-text); transition: all var(--transition-fast);
      z-index: 5;
    }
    .nav-arrow:hover { background: #fff; box-shadow: var(--shadow-lg); transform: translateY(-50%) scale(1.05); }
    .nav-prev { left: -24px; }
    .nav-next { right: -24px; }

    /* Text panel below image */
    .insight-panel {
      max-width: 840px; width: 100%; margin-top: var(--space-6);
      background: var(--color-surface); border-radius: var(--radius-xl);
      border: 1px solid var(--color-border); overflow: hidden;
      transition: all var(--transition-base);
    }
    .insight-header {
      padding: var(--space-5) var(--space-6);
      display: flex; align-items: flex-start; justify-content: space-between;
      cursor: pointer;
    }
    .insight-header:hover { background: var(--color-background); }
    .insight-main-idea {
      font-size: var(--font-size-xl); font-weight: 800; color: var(--color-text);
      line-height: 1.3;
    }
    .insight-toggle {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--color-background); border: 1px solid var(--color-border);
      display: flex; align-items: center; justify-content: center;
      color: var(--color-text-muted); flex-shrink: 0; margin-left: var(--space-4);
      transition: all var(--transition-fast);
    }
    .insight-toggle.open { transform: rotate(180deg); }
    .insight-body {
      padding: 0 var(--space-6) var(--space-6);
      display: none;
    }
    .insight-body.open { display: block; }
    .insight-summary {
      font-size: var(--font-size-base); line-height: 1.7;
      color: var(--color-text-secondary); margin-bottom: var(--space-5);
    }
    .supporting-ideas-label {
      font-size: var(--font-size-xs); font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--color-text-muted); margin-bottom: var(--space-3);
    }
    .supporting-idea {
      padding: var(--space-3) 0;
      border-top: 1px solid var(--color-border-light);
    }
    .supporting-idea-title {
      font-weight: 700; font-size: var(--font-size-sm);
      color: var(--color-primary); margin-bottom: var(--space-1);
    }
    .supporting-idea-detail {
      font-size: var(--font-size-sm); line-height: 1.6;
      color: var(--color-text-secondary);
    }

    /* Bottom controls */
    .viewer-bottom {
      padding: var(--space-4) var(--space-6);
      display: flex; align-items: center; justify-content: center; gap: var(--space-4);
      background: var(--color-surface); border-top: 1px solid var(--color-border);
    }
    .slide-counter { font-size: var(--font-size-sm); font-weight: 600; color: var(--color-text-secondary); }
    .slide-dots { display: flex; gap: var(--space-2); }
    .slide-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--color-border); transition: all var(--transition-fast);
      cursor: pointer;
    }
    .slide-dot.active { background: var(--color-primary); width: 24px; border-radius: 4px; }

    .viewer-progress {
      position: fixed; bottom: 0; left: 0; right: 0; height: 3px;
      background: var(--color-border-light); z-index: 20;
    }
    .viewer-progress-fill {
      height: 100%; background: var(--color-primary);
      transition: width var(--transition-base);
    }

    @media (max-width: 768px) {
      .viewer-main { padding: var(--space-4); }
      .nav-arrow { width: 36px; height: 36px; }
      .nav-prev { left: var(--space-2); }
      .nav-next { right: var(--space-2); }
    }
  </style>
</head>
<body>
  <div class="viewer">
    <!-- Top bar -->
    <div class="viewer-topbar">
      <div class="viewer-topbar-left">
        <button class="viewer-back">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          Back
        </button>
        <span class="viewer-title">How AI Is Changing Design in 2025</span>
        <span class="badge badge-success">12 insights</span>
      </div>
      <div class="viewer-topbar-right">
        <button class="btn btn-sm btn-secondary viewer-edit-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          Edit
        </button>
        <button class="btn btn-sm btn-accent viewer-publish-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
          Publish
        </button>
      </div>
    </div>

    <!-- Main slide area -->
    <div class="viewer-main">
      <div class="infographic-container">
        <button class="nav-arrow nav-prev" aria-label="Previous slide">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="nav-arrow nav-next" aria-label="Next slide">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>

        <!-- Infographic image (placeholder SVG) -->
        <div id="infographicArea" class="infographic-placeholder"></div>
      </div>

      <!-- Text panel below -->
      <div class="insight-panel" id="insightPanel">
        <div class="insight-header" id="insightHeader">
          <div class="insight-main-idea" id="insightTitle"></div>
          <div class="insight-toggle" id="insightToggle">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
        </div>
        <div class="insight-body" id="insightBody">
          <div class="insight-summary" id="insightSummary"></div>
          <div class="supporting-ideas-label">Supporting Ideas</div>
          <div id="supportingIdeas"></div>
        </div>
      </div>
    </div>

    <!-- Bottom -->
    <div class="viewer-bottom">
      <div class="slide-dots" id="dots"></div>
      <span class="slide-counter" id="counter">1 / 12</span>
    </div>
    <div class="viewer-progress"><div class="viewer-progress-fill" id="progressFill"></div></div>
  </div>
<script>
  // Slide data — 12 insights with placeholder infographic SVGs
  const insights = [
    {
      mainIdea: "Avoid Made-Up Startup Ideas",
      summary: "The most common mistake founders make is trying to think up startup ideas rather than noticing problems they personally experience. Manufactured ideas feel plausible but lack the organic urgency that drives great companies. The best startups emerge from founders who lived inside a problem domain long enough to see what others couldn't.",
      supportingIdeas: [
        { idea: "Organic vs. Manufactured Ideas", detail: "Ideas that come from personal frustration carry built-in conviction and domain knowledge that can't be replicated through market research alone." },
        { idea: "The Schlep Blindness Problem", detail: "Many valuable problems go unsolved because founders unconsciously avoid ideas that involve tedious, unglamorous work — creating opportunity for those who embrace it." },
        { idea: "Living in the Future", detail: "The best founders operate at the frontier of their field, which gives them early access to emerging problems before they become obvious to the mainstream." }
      ],
      colors: { bg: '#fff', accent: '#6366f1', title: '#1e293b' }
    },
    {
      mainIdea: "Build a Deep Well, Not a Shallow Pool",
      summary: "Startups succeed by going extraordinarily deep on a narrow problem rather than spreading thin across many. Depth creates defensibility, expertise, and product quality that broad competitors can't match. The counterintuitive insight is that the smaller your initial scope, the larger your eventual opportunity.",
      supportingIdeas: [
        { idea: "The Power of Narrow Focus", detail: "Every iconic startup started with a single use case executed at an elite level — Stripe with online payments, Figma with browser-based design. Breadth came later." },
        { idea: "Depth Creates Switching Costs", detail: "When you understand a problem domain better than anyone, your product becomes deeply embedded in users' workflows, making it nearly impossible to displace." },
        { idea: "Expert Networks Form Around Depth", detail: "Deep domain expertise attracts the best talent and advisors, creating a compounding advantage over generalist competitors." }
      ],
      colors: { bg: '#fff', accent: '#14b8a6', title: '#1e293b' }
    },
    {
      mainIdea: "AI Won't Replace Designers — It Will Amplify Them",
      summary: "The 2025 design landscape reveals that AI tools are augmenting human creativity rather than substituting it. The most effective design teams use AI to handle repetitive production work while humans focus on strategic thinking, emotional nuance, and creative direction that machines can't replicate.",
      supportingIdeas: [
        { idea: "The 80/20 Split Is Real", detail: "AI handles roughly 80% of production tasks (resizing, variants, documentation) freeing designers to invest deeply in the 20% that truly matters — conceptual thinking and craft." },
        { idea: "New Design Roles Are Emerging", detail: "Roles like 'AI Design Director' and 'Prompt-to-Production Lead' are appearing, reflecting a shift from manual execution to creative orchestration." },
        { idea: "Quality Ceilings Still Need Humans", detail: "While AI generates competent output quickly, the leap from good to great still requires human taste, cultural awareness, and emotional intelligence." }
      ],
      colors: { bg: '#fff', accent: '#f43f5e', title: '#1e293b' }
    },
    {
      mainIdea: "Design Systems Are Becoming Living Organisms",
      summary: "Modern design systems have evolved beyond static component libraries into dynamic, self-updating ecosystems. AI monitors usage patterns and automatically suggests improvements, new components, and deprecations. The system itself becomes an intelligent design partner.",
      supportingIdeas: [
        { idea: "Auto-Generated Components", detail: "AI analyzes recurring UI patterns in production code and proposes new reusable components before designers manually create them." },
        { idea: "Usage Analytics Drive Evolution", detail: "Real-time tracking of which components get used, modified, or abandoned provides data-driven guidance for design system roadmaps." },
        { idea: "Cross-Platform Consistency", detail: "AI ensures design tokens remain consistent across web, mobile, and emerging platforms, reducing the manual overhead of multi-platform maintenance." }
      ],
      colors: { bg: '#fff', accent: '#8b5cf6', title: '#1e293b' }
    },
    {
      mainIdea: "The Prototype Is the Product",
      summary: "The boundary between prototyping and production has dissolved. Tools that generate production-ready code from designs mean that the traditional handoff between design and engineering is becoming obsolete. What you prototype is increasingly close to what ships.",
      supportingIdeas: [
        { idea: "Zero-Handoff Workflows", detail: "Design-to-code tools now produce React, SwiftUI, and Flutter output that passes engineering code review, eliminating the translation layer entirely." },
        { idea: "Real Data in Prototypes", detail: "Modern prototypes connect to live APIs and databases, making user testing more realistic and reducing the gap between test and production behavior." },
        { idea: "Iteration Speed as Moat", detail: "Teams that can go from idea to production in hours rather than weeks have a fundamental competitive advantage in product development." }
      ],
      colors: { bg: '#fff', accent: '#f59e0b', title: '#1e293b' }
    },
    {
      mainIdea: "Personalization at Scale Changes Everything",
      summary: "AI enables interfaces that adapt to individual users in real-time — adjusting layout, content density, and visual hierarchy based on behavior patterns. One-size-fits-all design is giving way to contextually intelligent interfaces.",
      supportingIdeas: [
        { idea: "Behavioral Adaptation", detail: "Interfaces learn from individual interaction patterns — adjusting button sizes, menu depth, and information density to match each user's workflow." },
        { idea: "Context-Aware Layouts", detail: "The same application can present differently based on time of day, device, task context, and user expertise level." },
        { idea: "Ethical Boundaries", detail: "The power of personalization requires careful guardrails to prevent dark patterns, manipulation, and the creation of filter bubbles." }
      ],
      colors: { bg: '#fff', accent: '#14b8a6', title: '#1e293b' }
    },
    {
      mainIdea: "Voice and Gesture Are the Next Interface Frontier",
      summary: "As spatial computing matures, designers must think beyond screen-based interaction. Voice commands, hand gestures, and eye tracking are becoming primary input methods, requiring entirely new design paradigms and accessibility frameworks.",
      supportingIdeas: [
        { idea: "Spatial UI Patterns", detail: "Designing for 3D space requires new conventions for depth, proximity, and spatial memory that have no precedent in flat screen design." },
        { idea: "Multimodal Input", detail: "The most effective interfaces combine voice, gesture, gaze, and touch seamlessly, allowing users to switch modes naturally based on context." },
        { idea: "Accessibility-First Spatial Design", detail: "Spatial interfaces risk excluding users with motor or visual impairments unless accessibility is built in from the ground up." }
      ],
      colors: { bg: '#fff', accent: '#6366f1', title: '#1e293b' }
    },
    {
      mainIdea: "Data Visualization Is Becoming Conversational",
      summary: "Static charts and dashboards are being replaced by interactive, AI-powered data conversations. Users ask questions in natural language and receive dynamic visualizations that adapt to their inquiry, making data literacy accessible to everyone.",
      supportingIdeas: [
        { idea: "Natural Language to Charts", detail: "Instead of configuring chart types and axes, users describe what they want to see and AI generates the optimal visualization automatically." },
        { idea: "Narrative Data Storytelling", detail: "AI identifies the most interesting patterns in datasets and constructs visual narratives that guide viewers through key insights." },
        { idea: "Real-Time Collaborative Analysis", detail: "Multiple stakeholders can interact with the same data visualization simultaneously, each seeing annotations and highlights relevant to their role." }
      ],
      colors: { bg: '#fff', accent: '#f43f5e', title: '#1e293b' }
    },
    {
      mainIdea: "Adoption by the Numbers",
      summary: "The quantitative evidence for AI design adoption is overwhelming. Tool adoption has grown 340% year-over-year, with 67% of design teams now using generative UI tools daily. Teams report 4.2x faster iteration cycles compared to traditional workflows.",
      supportingIdeas: [
        { idea: "340% Tool Adoption Growth", detail: "From niche experimentation to mainstream adoption, AI design tools have seen explosive growth driven by tangible productivity gains and falling costs." },
        { idea: "67% Daily Usage Rate", detail: "The majority of professional design teams have moved past the trial phase and integrated AI tools into their daily production workflows." },
        { idea: "4.2x Iteration Speed", detail: "The ability to generate, test, and refine design variations in minutes rather than days has fundamentally changed how product teams approach iteration." }
      ],
      colors: { bg: '#fff', accent: '#8b5cf6', title: '#1e293b' }
    },
    {
      mainIdea: "The Ethics of AI-Generated Design",
      summary: "As AI generates more of what users see, questions of originality, attribution, and bias become critical. The design community is grappling with how to maintain creative integrity while leveraging tools that learn from existing human work.",
      supportingIdeas: [
        { idea: "Training Data Provenance", detail: "Designers are increasingly demanding transparency about what datasets AI tools were trained on and whether original creators were compensated." },
        { idea: "Bias in Generated Outputs", detail: "AI design tools can perpetuate and amplify existing biases in representation, cultural assumptions, and aesthetic preferences." },
        { idea: "New IP Frameworks", detail: "The legal and creative frameworks for AI-generated work are still being defined, creating uncertainty for teams and individuals." }
      ],
      colors: { bg: '#fff', accent: '#f59e0b', title: '#1e293b' }
    },
    {
      mainIdea: "Collaborative AI Is the Future of Design Teams",
      summary: "The most productive design teams in 2025 treat AI as a team member rather than a tool. AI participates in design critiques, suggests alternatives during brainstorming, and handles routine decisions autonomously, freeing human designers for high-judgment work.",
      supportingIdeas: [
        { idea: "AI as Design Critic", detail: "AI reviews designs against accessibility guidelines, brand standards, and user research findings, catching issues before human review cycles." },
        { idea: "Brainstorm Amplification", detail: "During ideation sessions, AI generates dozens of conceptual variations in real-time, expanding the creative space that human designers explore." },
        { idea: "Autonomous Routine Decisions", detail: "Spacing, alignment, color contrast, and responsive breakpoints are increasingly handled by AI, allowing designers to focus on higher-order decisions." }
      ],
      colors: { bg: '#fff', accent: '#14b8a6', title: '#1e293b' }
    },
    {
      mainIdea: "The Future Belongs to Design-Literate Engineers",
      summary: "The convergence of design and engineering means that professionals who understand both domains have an outsized advantage. The most impactful products of 2025 come from teams where engineers think like designers and designers understand systems.",
      supportingIdeas: [
        { idea: "Blurred Role Boundaries", detail: "The traditional designer-engineer handoff is dissolving as tools enable both roles to work in the same medium — code that looks like design, design that compiles to code." },
        { idea: "Full-Stack Product Thinking", detail: "The most effective product builders understand user psychology, visual communication, system architecture, and business strategy simultaneously." },
        { idea: "New Educational Models", detail: "Schools and bootcamps are increasingly offering hybrid programs that combine interaction design with software engineering, reflecting market demand." }
      ],
      colors: { bg: '#fff', accent: '#6366f1', title: '#1e293b' }
    }
  ];

  // SVG infographic generator (whiteboard-style placeholder)
  function generateInfographicSVG(insight, index) {
    const accent = insight.colors.accent;
    const ideas = insight.supportingIdeas;
    return `<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block;">
      <rect width="900" height="600" fill="#fff"/>
      <!-- Border sketch -->
      <rect x="20" y="20" width="860" height="560" rx="12" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="8 4"/>
      <!-- Title -->
      <text x="60" y="75" font-family="Inter,system-ui,sans-serif" font-size="28" font-weight="800" fill="${accent}">${escapeXml(insight.mainIdea)}</text>
      <!-- Divider line -->
      <line x1="60" y1="95" x2="400" y2="95" stroke="${accent}" stroke-width="3" stroke-linecap="round"/>
      <!-- Insight number badge -->
      <circle cx="840" cy="55" r="22" fill="${accent}" opacity="0.1"/>
      <text x="840" y="62" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="700" fill="${accent}" text-anchor="middle">${index + 1}</text>
      <!-- Summary box -->
      <rect x="60" y="115" width="500" height="120" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <text x="80" y="145" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#475569">
        ${wrapText(insight.summary, 70).map((line, i) => `<tspan x="80" dy="${i === 0 ? 0 : 18}">${escapeXml(line)}</tspan>`).join('')}
      </text>
      <!-- Supporting ideas as cards -->
      ${ideas.map((idea, i) => {
        const y = 260 + i * 105;
        const colors = ['#ef4444', '#22c55e', '#3b82f6', '#a855f7', '#f59e0b'];
        const dotColor = colors[i % colors.length];
        return `
        <circle cx="80" cy="${y + 18}" r="8" fill="${dotColor}" opacity="0.2"/>
        <circle cx="80" cy="${y + 18}" r="4" fill="${dotColor}"/>
        <text x="100" y="${y + 24}" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="700" fill="#1e293b">${escapeXml(idea.idea)}</text>
        <text x="100" y="${y + 46}" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#64748b">
          ${wrapText(idea.detail, 85).slice(0, 3).map((line, j) => `<tspan x="100" dy="${j === 0 ? 0 : 14}">${escapeXml(line)}</tspan>`).join('')}
        </text>`;
      }).join('')}
      <!-- Decorative elements -->
      <rect x="600" y="115" width="240" height="460" rx="8" fill="${accent}" opacity="0.04"/>
      <text x="620" y="150" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="700" fill="${accent}" text-transform="uppercase" letter-spacing="1">KEY INSIGHT</text>
      <line x1="620" y1="160" x2="820" y2="160" stroke="${accent}" stroke-width="1" opacity="0.3"/>
      <text x="620" y="185" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#475569" font-weight="600">
        ${wrapText(insight.summary.split('.')[0] + '.', 30).map((line, i) => `<tspan x="620" dy="${i === 0 ? 0 : 18}">${escapeXml(line)}</tspan>`).join('')}
      </text>
      <!-- Arrow doodle -->
      <path d="M620 280 C650 260 700 260 720 290" fill="none" stroke="${accent}" stroke-width="2" stroke-dasharray="4 3"/>
      <polygon points="718,285 725,295 715,293" fill="${accent}"/>
      <!-- Footer -->
      <text x="620" y="540" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#94a3b8">Generated by SlideGen • gpt-image-2</text>
    </svg>`;
  }

  function escapeXml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function wrapText(text, maxChars) {
    const words = text.split(' ');
    const lines = [];
    let current = '';
    for (const word of words) {
      if ((current + ' ' + word).trim().length > maxChars) {
        lines.push(current.trim());
        current = word;
      } else {
        current += ' ' + word;
      }
    }
    if (current.trim()) lines.push(current.trim());
    return lines;
  }

  let current = 0;
  const area = document.getElementById('infographicArea');
  const titleEl = document.getElementById('insightTitle');
  const summaryEl = document.getElementById('insightSummary');
  const supportEl = document.getElementById('supportingIdeas');
  const dotsEl = document.getElementById('dots');
  const counterEl = document.getElementById('counter');
  const progressFill = document.getElementById('progressFill');
  const insightBody = document.getElementById('insightBody');
  const insightToggle = document.getElementById('insightToggle');
  let panelOpen = true;

  function renderSlide() {
    const insight = insights[current];
    // Fade out then in
    area.style.opacity = 0;
    setTimeout(() => {
      area.innerHTML = generateInfographicSVG(insight, current);
      area.style.opacity = 1;
    }, 150);

    // Text panel
    titleEl.textContent = insight.mainIdea;
    summaryEl.textContent = insight.summary;
    supportEl.innerHTML = insight.supportingIdeas.map(si => `
      <div class="supporting-idea">
        <div class="supporting-idea-title">${si.idea}</div>
        <div class="supporting-idea-detail">${si.detail}</div>
      </div>
    `).join('');

    // Dots
    dotsEl.innerHTML = insights.map((_, i) =>
      `<div class="slide-dot${i === current ? ' active' : ''}" data-i="${i}"></div>`
    ).join('');
    dotsEl.querySelectorAll('.slide-dot').forEach(d => {
      d.addEventListener('click', () => { current = parseInt(d.dataset.i); renderSlide(); });
    });

    counterEl.textContent = `${current + 1} / ${insights.length}`;
    progressFill.style.width = `${((current + 1) / insights.length) * 100}%`;
  }

  // Toggle insight panel
  document.getElementById('insightHeader').addEventListener('click', () => {
    panelOpen = !panelOpen;
    insightBody.classList.toggle('open', panelOpen);
    insightToggle.classList.toggle('open', panelOpen);
  });
  insightBody.classList.add('open');
  insightToggle.classList.add('open');

  // Nav
  document.querySelector('.nav-prev').addEventListener('click', () => {
    current = (current - 1 + insights.length) % insights.length;
    renderSlide();
  });
  document.querySelector('.nav-next').addEventListener('click', () => {
    current = (current + 1) % insights.length;
    renderSlide();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') { current = (current - 1 + insights.length) % insights.length; renderSlide(); }
    if (e.key === 'ArrowRight') { current = (current + 1) % insights.length; renderSlide(); }
  });

  // Back → Landing
  document.querySelector('.viewer-back').addEventListener('click', () => { window.location.href = 'screen1-landing.html'; });
  // Edit → Edit Mode
  document.querySelector('.viewer-edit-btn').addEventListener('click', () => { window.location.href = 'screen5-edit.html'; });
  // Publish → Share Mode
  document.querySelector('.viewer-publish-btn').addEventListener('click', () => { window.location.href = 'screen4-share.html'; });

  renderSlide();
</script>
</body>
</html>
